<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sample Web Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 50px;
        }

        h1 {
            color: #007BFF;
        }

        p {
            color: #555;
        }

        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        img {
            margin-top: 20px;
            width: 250px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website</h1>

    <p>This is a simple HTML page with CSS and JavaScript.</p>

    <button onclick="showMessage()">Click Me</button>

    <br>

    <img src="https://via.placeholder.com/250" alt="Sample Image">

    <script>
        function showMessage() {
            alert("Hello! Thanks for clicking the button.");
        }
    </script>

</body>
</html>
